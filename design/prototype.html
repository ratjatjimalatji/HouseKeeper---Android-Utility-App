<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HouseKeeper Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="hk.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:#E4E5EA;min-height:100vh}
.p-wrap{display:grid;grid-template-columns:260px 1fr 300px;gap:24px;max-width:1280px;margin:0 auto;padding:24px 16px;align-items:start}
.p-panel{background:var(--surface);border-radius:16px;padding:16px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
.p-brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.p-brand .logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}
.p-brand b{font:500 15px var(--font);display:block}
.p-brand a{font:400 11.5px var(--font);color:var(--primary-text)}
.p-group{margin-top:12px}
.p-group h6{display:flex;gap:6px;align-items:center;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin:0 6px 4px}
.p-group h6 .ms{font-size:16px}
.p-link{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 8px 7px 28px;border-radius:8px;font:400 13.5px var(--font);color:var(--text);cursor:pointer}
.p-link:hover{background:var(--surface-2)}
.p-link.is-cur{background:var(--primary-soft);color:var(--primary-text);font-weight:500}
.p-center{display:flex;flex-direction:column;align-items:center;gap:12px}
.p-crumb{font:500 12px var(--mono);letter-spacing:.06em;color:var(--text-2);text-transform:uppercase}
.phone{width:360px;height:780px;border-radius:38px;border:9px solid #111;background:#111;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(0,0,0,.22);position:relative}
.sb{height:30px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font:500 13px var(--font);background:var(--bg);color:var(--text)}
.sb .ms{font-size:16px}
.sb.dark{background:var(--camera);color:#fff}
.scr{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg)}
.scr.dark{background:var(--camera)}
.pbody{flex:1;overflow-y:auto;padding:0 16px 20px;scrollbar-width:none}
.pbody::-webkit-scrollbar{display:none}
.gest{height:18px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.gest i{width:108px;height:4px;border-radius:2px;background:var(--text);opacity:.45}
.snack-wrap{position:absolute;left:12px;right:12px;z-index:30;animation:up .2s var(--ease)}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.p-notes h3{font:500 17px var(--font);margin-top:4px}
.p-notes p{font-size:13.5px;line-height:1.5;color:var(--text-2);margin-top:6px}
.p-notes h5{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin:18px 0 8px}
.p-notes ul{padding-left:18px;font-size:13px;line-height:1.6;color:var(--text)}
.p-notes .spec{display:inline-flex;font:500 11px var(--mono);background:var(--surface-2);border-radius:6px;padding:3px 8px;color:var(--text-2)}
.p-notes .chips .chip{font-size:12px;height:30px}
/* camera */
.camtop{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;z-index:2;color:#fff}
.pill{background:rgba(0,0,0,.55);border-radius:12px;padding:8px 12px;font:500 12px var(--mono);display:flex;gap:6px;align-items:center;cursor:pointer;color:#fff;border:none}
.utilsw{position:absolute;top:62px;left:0;right:0;display:flex;justify-content:center;gap:6px;z-index:2}
.utilsw>button{font:500 12px var(--font);padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.5);color:#cfd4d8;display:flex;gap:4px;align-items:center;border:none;cursor:pointer}
.utilsw>button.is-selected{background:var(--primary);color:var(--on-primary)}
.meterbox{position:absolute;left:50%;top:170px;transform:translateX(-50%);width:250px;height:120px;border-radius:10px;background:#2b302c;display:grid;place-items:center;box-shadow:inset 0 0 0 3px #3a403b}
.meterbox.dim{filter:brightness(.45) blur(1.5px)}
.lcd{background:var(--lcd);color:#1d2419;font:500 34px var(--mono);letter-spacing:3px;padding:8px 12px;border-radius:4px}
.lcd small{font-size:13px;letter-spacing:0;margin-left:4px}
.corners{position:absolute;left:50%;top:148px;transform:translateX(-50%);width:290px;height:164px}
.corners i{position:absolute;width:26px;height:26px;border-color:var(--primary);border-style:solid}
.corners i:nth-child(1){top:0;left:0;border-width:3px 0 0 3px}.corners i:nth-child(2){top:0;right:0;border-width:3px 3px 0 0}
.corners i:nth-child(3){bottom:0;left:0;border-width:0 0 3px 3px}.corners i:nth-child(4){bottom:0;right:0;border-width:0 3px 3px 0}
.corners.scanning i{border-color:#fff;opacity:.7}
.cpanel{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:24px 24px 0 0;padding:16px 16px 18px;color:var(--text)}
.numpad{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0 2px}
.numpad button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:500 15px var(--mono);cursor:pointer}
.numpad button:active{background:var(--surface-2)}
.dchk{display:flex;justify-content:space-between;align-items:center;gap:8px;border-radius:12px;padding:10px 12px;font:400 12px var(--mono);margin:12px 0}
.dchk.ok{background:var(--success-soft);color:var(--success)}
.dchk.warn{background:var(--warning-soft);color:var(--warning)}
/* misc */
.qr{width:84px;height:84px;border-radius:6px;border:6px solid var(--surface);outline:1px solid var(--line);background:conic-gradient(from 90deg at 30% 30%,var(--text) 25%,transparent 0) 0 0/18px 18px,var(--surface)}
.qr.big{width:180px;height:180px;background-size:30px 30px;margin:0 auto}
.codebig{display:grid;grid-template-columns:1fr 84px;gap:12px;align-items:center}
.code{font:500 26px var(--mono);color:var(--primary-text);letter-spacing:1px;margin:6px 0}
.tank{width:56px;height:96px;border-radius:16px 16px 10px 10px;border:2px solid var(--line-strong);position:relative;overflow:hidden;background:var(--surface-2);flex:none}
.tank>i{position:absolute;left:0;right:0;bottom:0;background:var(--gas);opacity:.85}
.sharegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sharegrid button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 12px var(--font);color:var(--text);cursor:pointer}
.sharegrid .ic{width:52px;height:52px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
.ad{border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--text-2);margin-top:12px}
.grp{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);margin:14px 0 6px}
@media(max-width:1100px){.p-wrap{grid-template-columns:1fr}.p-panel{position:static;max-height:none}.p-center{order:-1}}
@media(max-width:400px){.phone{transform:scale(.9);transform-origin:top center}}
</style>
</head>
<body>
<div class="p-wrap">
  <aside class="p-panel" id="menu"></aside>
  <div class="p-center">
    <div class="p-crumb" id="crumb"></div>
    <div class="phone">
      <div class="sb" id="sb"><span>18:42</span><span><span class="ms" id="netIcon">signal_cellular_alt</span> <span class="ms">battery_5_bar</span></span></div>
      <div class="scr" id="scr"></div>
      <div class="gest"><i></i></div>
    </div>
  </div>
  <aside class="p-panel p-notes" id="notes"></aside>
</div>

<script src="hk-cylinder.js"></script>
<script>
/* ================= STATE ================= */
const S = {
  screen:'home', stack:[], v:null, data:'full', online:true,
  util:'elec', rUtil:'elec', month:'Nov', bar:null, overlay:null, snack:null,
  elecLeft:36.2, rate:12.5, 
  cyls:[
    {id:'c3',size:9,color:'#1976D2',active:true,bought:'2026-10-14',start:'2026-10-16',end:null,supplier:'Afrigas Pretoria East',price:329,notes:'Kitchen stove',by:'Sipho'},
    {id:'c2',size:9,color:'#D32F2F',active:false,bought:'2026-08-27',start:'2026-08-29',end:'2026-10-16',supplier:'Easigas Hatfield',price:315,notes:'',by:'You'},
    {id:'c1',size:14,color:'#37474F',active:false,bought:'2026-06-05',start:'2026-06-07',end:'2026-08-29',supplier:'Afrigas Pretoria East',price:495,notes:'Winter: stove + heater',by:'Naledi'}],
  cylsEmpty:[], cylPage:1, draft:null, svcOpen:false, cylPop:true,
  activity:[
    {who:'NM',c:'av-green',name:'Naledi',text:'logged <b>3 733.4 kWh</b>',sub:'Electricity reading',when:'2 h ago',ic:'bolt'},
    {who:'NM',c:'av-green',name:'Naledi',text:'topped up <b>120 kWh</b> for R350',sub:'Prepaid electricity',when:'Yesterday',ic:'add_card'},
    {who:'SM',c:'av-water',name:'Sipho',text:'logged <b>1 284.6 m³</b>',sub:'Water reading',when:'Sat',ic:'water_drop'}],
  code:'HK-4F7Q2', req:true, house:'Pretoria Home',
  model:'7-SEGMENT', torch:false, editIdx:null, digits:null,
  manual:'', topAmt:'', topUnits:'', join:'', joinErr:false,
  exportFmt:'PDF', period:0, order:null, size:'9 kg', supplier:null, supPrice:329,
  sug:null, busy:null,
  notif:{buy:true,gas:true,nudge:false,anom:true,summary:true}, ocr:1,
  readings:{
    elec:[{v:3733.4,t:'Today 16:40',by:'Naledi',s:'ok'},{v:3722.2,t:'Yesterday 19:05',by:'You',s:'ok'},{v:3710.9,t:'Mon 26 Nov',by:'Sipho',s:'ok'},{v:3698.6,t:'Sun 25 Nov',by:'You',s:'ok'},{v:3686.0,t:'Sat 24 Nov',by:'Naledi',s:'ok'}],
    water:[{v:1284.6,t:'Sat 24 Nov',by:'Sipho',s:'ok'},{v:1283.3,t:'Wed 21 Nov',by:'You',s:'ok'},{v:1281.9,t:'Sun 18 Nov',by:'Naledi',s:'ok'}]
  },
  members:[['LM','Lerato (you)','Owner','av-amber',''],['NM','Naledi','Admin','av-green','Logged electricity 2 h ago'],['SM','Sipho','Member','av-water',''],['GM','Gogo','Viewer','av-gas','Polokwane']],
};
const U = {
  elec:{name:'Electricity',icon:'bolt',unit:'kWh',ic:'ic-elec',scan:'03745.6',digits:['3','7','4','5','.','6'],unsure:2,read:3745.6},
  water:{name:'Water',icon:'water_drop',unit:'m³',ic:'ic-water',scan:'01285.9',digits:['1','2','8','5','.','9'],unsure:3,read:1285.9},
  gas:{name:'Gas',icon:'propane_tank',unit:'kg',ic:'ic-gas'}
};
const REP = {
  elec:{n7:['87.5','kWh'],me:['386','kWh'],d:['up','4% vs Oct'],cost:'R1 080',so:'R642 so far',based:['14','readings'],tariff:'R2.89 / kWh',conf:['b-success','High confidence'],
    daily:[55,58,52,60,57,62,50,56,59,61,54,58,57,60,55,57,88,92,85,60,58,56,59,57,58],unitDay:'kWh',avg:'12.5',scale:18,
    anom:'<b>Spike 17–19 Nov, +28%.</b> Matches a geyser left on. Cooler weather explains about 6% of it.',sug:['Put the geyser on a timer','~R180/month','Weekday mornings (6–8 a.m.) use 40% more than weekends. Based on 6 weeks of readings.']},
  water:{n7:['2.9','m³'],me:['12.8','m³'],d:['down','3% vs Oct'],cost:'R410',so:'R214 so far',based:['6','readings'],tariff:'R32.10 / m³',conf:['b-warning','Medium confidence'],
    daily:[40,42,45,41,44,43,40,46,42,41,43,45,44,42,41,43,44,42,40,45,43,41,42,44,43],unitDay:'m³',avg:'0.42',scale:0.8,
    anom:'<b>No unusual water use this month.</b> Night-time use stays flat, so a leak is unlikely.',sug:['Shorter garden watering','~R60/month','Saturday use is double the weekday average. Watering before 8 a.m. loses less to evaporation.']},
  gas:{n7:['1.4','kg'],me:['6.1','kg'],d:['up','2% vs Oct'],cost:'R240',so:'Per 9 kg: R329',based:['2','swaps'],tariff:'R33.10 / kg',conf:['b-neutral','Low confidence'],
    daily:[30,30,30,30,30,30,30,32,32,32,32,32,32,32,31,31,31,31,31,31,31,33,33,33,33],unitDay:'kg',avg:'0.2',scale:0.6,
    anom:'<b>Estimated from cylinder swaps.</b> Gas use is spread evenly between swaps, so daily changes aren\'t shown.',sug:['Lid on the pot','~R40/month','Cooking takes most of your gas. A lid cuts boiling time by about a third.']}
};
const TAB = {home:0,reports:1,household:3,settings:4};

/* ================= HELPERS ================= */
const $ = s=>document.querySelector(s);
const fmt = n=>n.toLocaleString('en-ZA',{minimumFractionDigits:1,maximumFractionDigits:1}).replace(',', '.');
const days = ()=>S.elecLeft/S.rate;
const icon=(n,c='')=>`<span class="ms ${c}">${n}</span>`;
const TODAY='2026-11-26';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dOf=s=>new Date(s+'T00:00:00');
const daysBetween=(a,b)=>Math.round((dOf(b)-dOf(a))/864e5);
const fmtDate=s=>{const d=dOf(s);return d.getDate()+' '+MON[d.getMonth()]};
const addDays=(s,n)=>{const d=dOf(s);d.setDate(d.getDate()+n);const w=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];return w+' '+d.getDate()+' '+MON[d.getMonth()]};
const colorName=hex=>(HK_CYL_COLORS.find(c=>c[1]===hex)||['Custom'])[0];
const cylList=()=>S.data==='empty'?S.cylsEmpty:S.cyls;
const sortedCyls=()=>cylList().slice().sort((a,b)=>(b.active-a.active)||(dOf(b.start)-dOf(a.start)));
const activeCyl=()=>cylList().find(c=>c.active);
const cylDays=c=>Math.max(0,daysBetween(c.start,c.end||TODAY));
const gasRate=()=>{const f=cylList().filter(c=>!c.active&&cylDays(c)>0);return f.length?f.reduce((a,c)=>a+c.size/cylDays(c),0)/f.length:.18};
const gasProj=c=>c.active?hkGasProjection(c,gasRate(),cylDays(c)):{leftKg:0,level:0,daysLeft:0};
const activityRow=a=>`<div class="activity-row"><span class="av sm ${a.c}">${a.who}</span><div class="what">${a.name} ${a.text}<span class="sub">${a.sub}</span></div><span class="when">${a.when}</span></div>`;
const logActivity=(text,sub,ic)=>S.activity.unshift({who:'LM',c:'av-amber',name:'You',text,sub,when:'Just now',ic});
const cylMini=(c,lvl)=>`<span class="cyl-mini">${hkCylinder({color:c.color,size:c.size,level:lvl,mini:true,scale:.157})}</span>`;
const pending = ()=>Object.values(S.readings).flat().filter(r=>r.s==='wait').length;
const gaugeHTML=(n,cls)=>`<div class="gauge ${cls}">${Array.from({length:20},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
const appbar=(title,right='')=>`<div class="appbar"><div class="lead"><span class="icon-btn bare" data-act="back">${icon('arrow_back')}</span><span class="title">${title}</span></div><div style="display:flex;gap:6px">${right}</div></div>`;
const tabbar=title=>`<div class="appbar"><span class="title">${title}</span>`;
const navbar=a=>`<div class="navbar">
 <div class="${a==0?'is-active':''}" data-go="home">${icon('space_dashboard')}Home</div>
 <div class="${a==1?'is-active':''}" data-go="reports">${icon('monitoring')}Reports</div>
 <div><button class="fab-scan" data-go="scan" aria-label="Scan a meter">${icon('document_scanner')}</button></div>
 <div class="${a==3?'is-active':''}" data-go="household">${icon('group')}Household</div>
 <div class="${a==4?'is-active':''}" data-go="settings">${icon('settings')}Settings</div></div>`;
const empty=(i,h,p,btn='',art='')=>`<div class="empty"><div class="art ${art}">${icon(i)}</div><h4>${h}</h4><p>${p}</p>${btn}</div>`;
const offlineBanner=()=>!S.online?`<div class="banner banner-offline" style="margin-bottom:10px">${icon('cloud_off')}<span class="grow">You're offline${pending()?` · ${pending()} reading${pending()>1?'s':''} waiting to sync`:''}</span></div>`:(pending()?`<div class="banner banner-info" style="margin-bottom:10px">${icon('sync')}<span class="grow">Syncing ${pending()} reading${pending()>1?'s':''}…</span></div>`:'');
const sk=(w,h,extra='')=>`<div class="sk" style="width:${w};height:${h}px;${extra}"></div>`;
const btn=(cls,ic,label,act,busyLabel)=>S.busy===act?`<button class="btn ${cls} is-loading"><span class="spin"></span>${busyLabel}</button>`:`<button class="btn ${cls}" data-act="${act}">${ic?icon(ic):''}${label}</button>`;

/* ================= SCREENS ================= */
const SCREENS = {

home(){
  if(S.data==='loading') return {nav:0,body:`<div class="appbar">${sk('140px',16)}${sk('40px',40,'border-radius:12px')}</div><div class="pbody">
    <div class="tiles">${[1,2,3].map(()=>`<div class="tile"><span class="sk" style="width:36px;height:36px;border-radius:11px"></span>${sk('60px',11,'margin-top:4px')}${sk('40px',9)}</div>`).join('')}</div>
    <div class="hero" style="margin-top:10px">${sk('110px',11)}${sk('150px',48,'margin:10px 0 8px')}${sk('240px',11)}${sk('100%',12,'margin:14px 0')}${sk('100%',44,'border-radius:12px')}</div>
    <div class="card flush" style="margin-top:10px">${[1,2,3].map(()=>`<div class="list-row"><span class="sk" style="width:34px;height:34px;border-radius:10px"></span><div>${sk('120px',12)}${sk('80px',10,'margin-top:6px')}</div>${sk('40px',16)}</div>`).join('')}</div></div>`};
  const head=`<div class="appbar"><div class="hh-switch" data-act="houseSheet"><span>${S.house} ${icon('expand_more','sm muted')}</span><small>${S.data==='empty'?'1 MEMBER':'4 MEMBERS'} · ${S.online?(pending()?'SYNCING':'SYNCED'):'OFFLINE'}</small></div><span class="icon-btn" data-go="notifications">${icon('notifications')}${S.data==='full'?'<i class="dot"></i>':''}</span></div>`;
  if(S.data==='empty') return {nav:0,body:head+`<div class="pbody">${offlineBanner()}
    <div class="tiles">
      <div class="tile" data-go="scan" data-util="elec"><span class="ic ic-elec">${icon('bolt','fill')}</span><b>Electricity</b><span>No readings</span></div>
      <div class="tile" data-go="scan" data-util="water"><span class="ic ic-water">${icon('water_drop','fill')}</span><b>Water</b><span>No readings</span></div>
      <div class="tile" data-go="gas"><span class="ic ic-gas">${icon('propane_tank','fill')}</span><b>Gas</b><span>No cylinder</span></div></div>
    <div class="card" style="margin-top:10px">${empty('bolt','Log your first reading','Point the camera at your electricity meter. After 3 readings we can tell you when units will run out.',`<button class="btn btn-primary" data-go="scan" data-util="elec">${icon('document_scanner')}Scan electricity meter</button>`,'amber')}</div>
    <div class="card" style="margin-top:10px;display:flex;gap:12px;align-items:center" data-go="household"><span class="ic ic-neutral">${icon('group_add')}</span><div style="flex:1"><b class="t-title" style="font-size:14px">Invite your household</b><div class="t-caption">Share code ${S.code} so others can log too</div></div>${icon('chevron_right','muted')}</div>
  </div>`};
  const d=days(), crit=d<3, ok=d>=7, n=Math.max(1,Math.min(20,Math.round(d/14*20)));
  const lastE=S.readings.elec[0], lastW=S.readings.water[0];
  return {nav:0,body:head+`<div class="pbody">${offlineBanner()}
    <div class="tiles">
      <div class="tile" data-go="scan" data-util="elec"><span class="ic ic-elec">${icon('bolt','fill')}</span><b>Electricity</b><span>${lastE.by==='You'?'Just now':'2 h ago'}</span></div>
      <div class="tile" data-go="scan" data-util="water"><span class="ic ic-water">${icon('water_drop','fill')}</span><b>Water</b><span>${lastW.by==='You'&&lastW.t.startsWith('Today')?'Just now':'3 days ago'}</span></div>
      <div class="tile" data-go="gas"><span class="ic ic-gas">${icon('propane_tank','fill')}</span><b>Gas</b><span>${activeCyl()?'Swapped '+fmtDate(activeCyl().start):'No cylinder'}</span></div></div>
    <div class="hero ${crit?'is-critical':ok?'is-ok':''}" style="margin-top:10px">
      <div style="display:flex;justify-content:space-between"><span class="t-label">Electricity left</span><span class="link" data-go="usage" data-util="elec">Details</span></div>
      <div class="t-display">${fmt(d)}<small>days</small></div>
      <div class="t-caption">${fmt(S.elecLeft)} kWh at ${S.rate} kWh/day · ${crit?'empty around Thu 29 Nov':'lasts until about '+(ok?'Sat 8 Dec':'Mon 3 Dec')}</div>
      ${gaugeHTML(n,crit?'is-low':ok?'is-ok':'')}
      <div class="btn-row">${crit?`<button class="btn btn-primary" data-act="buy">${icon('open_in_new')}Buy electricity</button>`:''}<button class="btn btn-secondary" data-go="topup">${icon('add')}${crit?'Top-up':'Log top-up'}</button></div>
    </div>
    <div class="card flush" style="margin-top:10px">
      ${gasHomeRow()}

gas(){
  const pages=['new',...sortedCyls()];
  if(S.cylPage>=pages.length) S.cylPage=pages.length-1;
  if(S.cylPage<0) S.cylPage=0;
  const pg=pages[S.cylPage];
  if(!S.draft) S.draft = pg==='new' ? {id:null,isNew:true,size:9,color:'#D32F2F',active:true,bought:TODAY,start:TODAY,end:null,supplier:'',notes:'',price:''} : {...pg};
  const d=S.draft, rate=gasRate(), isNew=!!d.isNew;
  const used=isNew?0:cylDays(d);
  const proj=isNew?{leftKg:d.size,level:1,daysLeft:Math.floor(d.size/rate)}:d.active?hkGasProjection(d,rate,used):{leftKg:0,level:0,daysLeft:0};
  const pct=Math.round(proj.level*100);
  const tone=proj.daysLeft<5?'var(--danger)':proj.daysLeft<10?'var(--elec)':'var(--success)';
  const status=isNew?['b-info','add_circle','New cylinder']:d.active?['b-success','local_fire_department','Active in service']:['b-neutral','history','Used up'];
  const empty0=cylList().length===0;

  // level projection: next 14 days, today solid in the cylinder's own colour
  let projChart='';
  if(isNew||d.active){
    const bars=Array.from({length:14},(_,i)=>{const l=Math.max(0,proj.leftKg-rate*i)/Math.max(.01,proj.leftKg);return l<=0?`<i class="is-anomaly" style="height:4%"></i>`:i===0?`<i style="height:${Math.max(6,l*100)}%;background:${d.color}"></i>`:`<i class="is-projected" style="height:${Math.max(6,l*100)}%"></i>`}).join('');
    projChart=`<div class="t-label" style="margin-top:10px">Gas left · next 14 days</div><div class="bars" style="height:54px;margin-top:6px;gap:2px">${bars}</div><div class="axis"><span>Today</span><span>+7</span><span>+14</span></div>`;
  }
  const side = isNew ? `<span class="t-label">Starts full</span><div class="t-display" style="font-size:40px;color:var(--success);margin:6px 0 2px">${proj.daysLeft}<small style="font:500 15px var(--mono);color:var(--text);margin-left:4px">days</small></div><div class="t-caption">${d.size} kg at your ${rate.toFixed(2)} kg/day</div><div class="t-caption">Runs out around <b style="color:var(--text)">${addDays(d.start||TODAY,proj.daysLeft)}</b></div>${projChart}`
   : d.active ? `<span class="t-label">Gas left</span><div class="t-display" style="font-size:40px;color:${tone};margin:6px 0 2px">${proj.daysLeft}<small style="font:500 15px var(--mono);color:var(--text);margin-left:4px">days</small></div><div class="t-caption"><b style="color:var(--text);font-family:var(--mono)">${pct}%</b> · ${proj.leftKg.toFixed(1)} of ${d.size} kg</div><div class="t-caption">Empty around <b style="color:var(--text)">${addDays(TODAY,proj.daysLeft)}</b></div><span class="badge ${cylList().filter(c=>!c.active).length>=2?'b-warning':'b-neutral'}" style="margin-top:6px">${icon('insights')}${cylList().filter(c=>!c.active).length} past cylinders</span>${projChart}`
   : `<span class="t-label">Lasted</span><div class="t-display" style="font-size:40px;color:var(--text);margin:6px 0 2px">${used}<small style="font:500 15px var(--mono);margin-left:4px">days</small></div><div class="t-caption">${fmtDate(d.start)} – ${fmtDate(d.end)}</div><div class="t-caption"><b style="color:var(--text);font-family:var(--mono)">${(d.size/Math.max(1,used)).toFixed(2)} kg/day</b> average</div>${d.supplier?`<div class="t-caption">${d.supplier}${d.price?' · R'+d.price:''}</div>`:''}`;

  const hero=`<div class="card" style="padding:12px 12px 14px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="badge ${status[0]}">${icon(status[1])}${status[2]}</span>
      <div style="display:flex;align-items:center;gap:2px"><button class="icon-btn bare ${S.cylPage===0?'is-disabled':''}" data-act="cylPrev" aria-label="Previous cylinder">${icon('chevron_left')}</button><span class="t-label" style="min-width:34px;text-align:center">${S.cylPage+1}/${pages.length}</span><button class="icon-btn bare ${S.cylPage===pages.length-1?'is-disabled':''}" data-act="cylNext" aria-label="Next cylinder">${icon('chevron_right')}</button></div>
    </div>
    <div style="display:grid;grid-template-columns:138px 1fr;gap:12px;align-items:end;margin-top:4px">
      <div class="cyl-stage" style="height:272px" data-act="cycleColor" title="Tap to cycle colour"><div class="${S.cylPop?'cyl-pop':''}">${hkCylinder({color:d.color,size:d.size,level:isNew?null:proj.level,placeholder:isNew,scale:.82})}</div></div>
      <div style="padding-bottom:16px">${side}</div>
    </div>
    <div class="pager-dots" style="margin-top:10px">${pages.map((_,i)=>`<i data-act="cylPage" data-i="${i}" class="${i===S.cylPage?'is-current':i<S.cylPage?'is-visited':''}"></i>`).join('')}</div>
    <div class="t-caption" style="text-align:center;margin-top:6px">${isNew?'Set size and colour below, then save':'Swipe through your cylinders · tap the cylinder to recolour'}</div>
  </div>`;

  const actions = (!isNew&&d.active) ? `<div class="btn-row" style="margin-top:10px"><button class="btn btn-primary" data-go="order">${icon('local_shipping')}Order gas</button><button class="btn btn-secondary" data-act="swapCyl">${icon('swap_horiz')}Swap cylinder</button></div>` : '';
  const orderCard = S.order&&!isNew&&d.active ? `<div class="card" style="margin-top:10px;border-color:var(--primary)"><div style="display:flex;justify-content:space-between;align-items:center"><span class="t-label c-amber">Order sent</span><span class="badge b-info">Awaiting delivery</span></div><div class="t-title" style="font-size:15px;margin-top:6px">${S.order} · ${S.size}</div><div class="t-caption">Sent on WhatsApp today 18:50</div><button class="btn btn-tonal btn-block" style="margin-top:10px" data-act="delivered">${icon('inventory_2')}Mark as delivered</button></div>` : '';

  const maxH=305, sil=k=>Math.round(40*({4:190,9:225,14:265,48:305}[k])/maxH);
  const svcDays = `<div class="stat-grid" style="margin-top:4px"><div><span class="t-label">In service</span><b class="t-num-l">${used} <small>days</small></b></div><div><span class="t-label">Stored first</span><b class="t-num-l">${Math.max(0,daysBetween(d.bought||d.start,d.start))} <small>days</small></b></div></div>`;
  const details=`<div class="card" style="margin-top:10px">
    <div class="t-title">${isNew?'New cylinder':`Edit ${d.size} kg cylinder`}</div><div class="t-caption">Status, size and colour</div>
    <div class="field-label" style="margin:14px 0 6px">Status</div>
    <div class="seg"><button class="${d.active?'is-selected':''}" data-act="cylStatus" data-v="1">${icon('local_fire_department','xs')}Active (in use)</button><button class="${!d.active?'is-selected':''}" data-act="cylStatus" data-v="0">${icon('history','xs')}Used up</button></div>
    <div class="field-label" style="margin:14px 0 6px">Size</div>
    <div class="size-opts">${HK_CYL_SIZES.map(z=>`<button class="size-opt ${d.size===z.kg?'is-selected':''}" data-act="cylSize" data-k="${z.kg}"><span class="sil">${hkCylinder({color:d.size===z.kg?d.color:'#B8BEC4',size:z.kg,mini:true,scale:.135})}</span><b>${z.title}</b><span>${z.use}</span></button>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;margin:14px 0 6px"><span class="field-label">Colour</span><span class="t-caption">${colorName(d.color)}</span></div>
    <div class="swatch-row">${HK_CYL_COLORS.map(([n,h])=>`<button class="swatch ${d.color===h?'is-selected':''}" style="background:${h}" data-act="cylColor" data-c="${h}" aria-label="${n}">${d.color===h?icon('check'):''}</button>`).join('')}</div>
    <div style="border-top:1px solid var(--line);margin:12px -16px 0;padding:12px 16px 0">
      <div class="collapse-h" data-act="svcToggle"><span class="ic ic-neutral">${icon('event_note')}</span><div class="grow"><b style="font:500 14px var(--font)">Service dates & details</b><div class="t-caption">${S.svcOpen?'Bought, start date, supplier, notes':`Optional · ${d.supplier||'no supplier'}${d.notes?' · '+d.notes:''}`}</div></div>${icon(S.svcOpen?'expand_less':'expand_more','muted')}</div>
      ${S.svcOpen?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px">
        <div class="field"><label class="field-label">Bought</label><label class="input" style="height:46px"><input type="date" data-field="bought" value="${d.bought||''}" style="font:400 14px var(--font)"></label></div>
        <div class="field"><label class="field-label">Started using</label><label class="input" style="height:46px"><input type="date" data-field="start" value="${d.start||''}" style="font:400 14px var(--font)"></label></div></div>
        ${svcDays}
        <div class="field" style="margin-top:10px"><label class="field-label">Supplier</label><label class="input" style="height:46px">${icon('storefront','sm muted')}<input data-field="supplier" value="${d.supplier||''}" placeholder="e.g. Afrigas"></label></div>
        <div class="field" style="margin-top:10px"><label class="field-label">Notes</label><label class="input" style="height:46px">${icon('edit_note','sm muted')}<input data-field="notes" value="${d.notes||''}" placeholder="e.g. Kitchen stove"></label></div>`:''}
    </div>
    <div style="margin-top:14px">${btn('btn-primary btn-lg btn-block',isNew?'add_circle':'save',isNew?`Save new ${d.size} kg cylinder`:`Update ${d.size} kg cylinder`,'cylSave','Saving…')}</div>
  </div>`;

  const hist = sortedCyls();
  const history=`<div class="section-h"><span class="t-label">Cylinder history</span><span class="t-caption">${hist.length} logged</span></div>
    ${hist.length?`<div class="card flush">${hist.map((c,i)=>{const days=cylDays(c), p=gasProj(c), sel=!isNew&&c.id===d.id;
      return `<div class="list-row is-pressable" data-act="cylFocus" data-i="${i+1}" style="${sel?'background:var(--primary-soft)':''}">${cylMini(c,c.active?p.level:null)}
      <div><b>${c.size} kg cylinder</b><span class="sub">${colorName(c.color)}${c.supplier?' · '+c.supplier.split(' ')[0]:''}</span><span class="sub">${fmtDate(c.start)} – ${c.end?fmtDate(c.end):'now'} · ${days} days</span>
      <div style="margin-top:4px">${c.active?`<span class="badge b-success">Active · ${Math.round(p.level*100)}% left</span>`:'<span class="tag">Finished</span>'}</div></div>
      <div style="display:flex;align-items:center;gap:2px"><div class="num">${c.active?gasRate().toFixed(2):days?(c.size/days).toFixed(2):'—'}<small>${c.active?'kg/day est.':'kg/day'}</small></div><span class="icon-btn bare" data-act="cylDel" data-id="${c.id}" aria-label="Delete">${icon('delete','sm')}</span></div></div>`}).join('')}</div>`
    :`<div class="card">${empty('propane_tank','No cylinders logged yet','Save your first cylinder above. After it runs out, we\'ll use its kg/day to predict the next one.')}</div>`}`;

  S.cylPop=false;
  return {body:appbar('Gas cylinder',`<span class="icon-btn" data-act="swapCyl" aria-label="New cylinder">${icon('add_circle')}</span>`)+`<div class="pbody">
    ${empty0?`<div class="banner banner-info" style="margin-bottom:10px">${icon('info')}<span class="grow">Add the cylinder you're using now. We'll estimate when it runs out.</span></div>`:''}
    ${hero}${actions}${orderCard}${details}${history}</div>`};
},

function gasHomeRow(){
  const c=activeCyl();
  if(!c) return `<div class="list-row is-pressable" data-go="gas"><span class="ic ic-gas">${icon('propane_tank','fill')}</span><div><b>Gas</b><span class="sub">No cylinder yet · tap to add</span></div>${icon('chevron_right','muted')}</div>`;

const BASE={4:165,9:329,14:495,48:1650};
const priceFor=(f)=>Math.round(BASE[parseInt(S.size)]*f);

   :`<button class="btn btn-primary btn-lg btn-block" data-act="saveTop" ${units>0?'':'disabled'}>${icon('check')}Save top-up</button>`;

function updateManual(){
  const inp=$('#mIn'); if(!inp) return;
  const run=()=>{

/* ================= RENDER ================= */
let snackTimer;
function render(){
  const s=SCREENS[S.screen](); const scr=$('#scr');
  $('#sb').classList.toggle('dark',!!s.dark); scr.classList.toggle('dark',!!s.dark);
  $('#netIcon').textContent=S.online?'signal_cellular_alt':'signal_cellular_off';
  let html=s.body.includes('class="pbody"')||s.dark?s.body:s.body;
  if(s.nav!=null) html+=navbar(s.nav);
  if(S.overlay){const o=OV[S.overlay]();html+=`<div class="scrim ${o.startsWith('<div class="dialog')?'center':''}" data-act="scrim">${o}</div>`}
  if(S.snack) html+=`<div class="snack-wrap" style="bottom:${s.nav!=null?88:14}px"><div class="snack">${S.snack.icon?icon(S.snack.icon,'sm'):''}<span class="grow">${S.snack.text}</span>${S.snack.action?`<span class="act" data-act="snackAct">${S.snack.action}</span>`:''}</div></div>`;
  const prevScroll=scr.querySelector('.pbody')?.scrollTop||0;
  scr.innerHTML=html;
  if(S._keepScroll){const pb=scr.querySelector('.pbody');if(pb)pb.scrollTop=prevScroll}
  S._keepScroll=false;
  s.after&&s.after();
  renderMenu(); renderNotes();
}
function rerender(){S._keepScroll=true;render()}
function go(screen,opts={}){
  if(screen!==S.screen){S.stack.push(S.screen)}
  S.screen=screen; S.overlay=null; S.bar=null; S.editIdx=null; S.v=opts.v||null; S.busy=null;
  if(opts.util) S.util=opts.util;
  if(screen==='scan'){S.digits=null; if(!opts.v){S.v='scanning'; const tok=Date.now(); S._scanTok=tok; setTimeout(()=>{if(S.screen==='scan'&&S._scanTok===tok&&S.v==='scanning'){S.v='detected';rerender()}},1100)}}
  if(screen==='manual'&&opts.prefill!==false&&S.stack[S.stack.length-1]==='scan'){S.manual=(S.digits||U[S.util].digits).join('')} else if(screen==='manual'&&!opts.keep){S.manual=''}
  if(screen==='topup'){S.topAmt='';S.topUnits=''}
  if(screen==='gas'){S.draft=null;S.cylPop=true;S.cylPage=cylList().length?1:0}
  if(screen==='join'&&!opts.v){S.join='';S.joinErr=false}
  render(); $('#scr .pbody')&&($('#scr .pbody').scrollTop=0);
}
function back(){S.screen=S.stack.pop()||'home';S.overlay=null;S.v=null;S.busy=null;S.editIdx=null;render()}
function snack(text,{action,icon:ic,undo}={}){S.snack={text,action,icon:ic,undo};clearTimeout(snackTimer);snackTimer=setTimeout(()=>{S.snack=null;rerender()},action?6000:4000)}
function later(key,ms,fn){S.busy=key;rerender();setTimeout(()=>{S.busy=null;fn();rerender()},ms)}
function addReading(util,v){
  const r={v,t:'Today 18:'+(43+Math.floor(Math.random()*9)),by:'You',s:S.online?'ok':'wait'};
  S.readings[util].unshift(r);
  logActivity(`logged <b>${fmt(v)} ${U[util].unit}</b>`,U[util].name+' reading'+(r.s==='wait'?' · waiting to sync':''),U[util].icon);
  if(util==='elec'&&S.online===true){S.elecLeft=Math.max(0,S.elecLeft-0)}
  return r;
}
function saveNewCylinder(o){
  const list=cylList();
  list.forEach(c=>{if(c.active){c.active=false;c.end=TODAY}});
  const c={id:'c'+Date.now(),size:o.size||9,color:o.color||'#D32F2F',active:o.active!==false,bought:o.bought||TODAY,start:o.start||TODAY,end:null,supplier:o.supplier||'',price:o.price||'',notes:o.notes||'',by:'You'};
  if(!c.active)c.end=TODAY;
  list.push(c); S.draft=null; S.cylPage=sortedCyls().findIndex(x=>x.id===c.id)+1; S.cylPop=true;
  logActivity(`swapped in a new <b>${c.size} kg</b> cylinder`,colorName(c.color)+' · gas','propane_tank');
}
function savedSnack(util,r){
  snack(S.online?`Reading saved · ${fmt(r.v)} ${U[util].unit}`:'Saved on phone. Will sync when you\'re online.',{action:'UNDO',icon:S.online?'check_circle':'cloud_upload',undo:()=>{S.readings[util].shift();snack('Reading removed')}});
}

/* ================= EVENTS ================= */
document.addEventListener('input',e=>{const f=e.target.dataset&&e.target.dataset.field; if(f&&S.draft&&e.target.type!=='date'){S.draft[f]=e.target.value}});
document.addEventListener('change',e=>{const f=e.target.dataset&&e.target.dataset.field; if(f&&S.draft&&e.target.type==='date'&&e.target.value){S.draft[f]=e.target.value;rerender()}});
document.addEventListener('click',e=>{
  const goEl=e.target.closest('[data-go]');
  const actEl=e.target.closest('[data-act]');
  if(actEl && (!goEl || goEl.contains(actEl))){ handle(actEl.dataset.act, actEl, e); return; }
  if(goEl){ if(S.overlay&&!goEl.closest('.scrim')){S.overlay=null} go(goEl.dataset.go,{util:goEl.dataset.util,v:goEl.dataset.v}); }
});
function handle(a,el,e){
  const d=el.dataset;
  switch(a){
  case 'back': back(); break;
  case 'scrim': if(e.target===el){S.overlay=null;rerender()} break;
  case 'close': S.overlay=null; rerender(); break;
  case 'snackAct': const u=S.snack.undo; S.snack=null; u?u():null; rerender(); break;
  case 'buy': snack('Opens your bank app or prepaid vendor, outside HouseKeeper',{icon:'open_in_new'}); rerender(); break;
  case 'houseSheet': case 'exportSheet': case 'periodSheet': case 'shareSheet': case 'newCode': case 'deleteAcct':
    S.overlay=a; rerender(); break;
  case 'pickHouse': S.house=d.n; S.overlay=null; snack('Switched to '+d.n,{icon:'home'}); rerender(); break;
  case 'goJoin': S.overlay=null; go('join'); break;
  /* scanner */
  case 'sutil': S.util=d.u; S.digits=null; S.editIdx=null; S.v='detected'; rerender(); break;
  case 'model': {const M=['ML KIT','7-SEGMENT','SLASHED-ZERO']; S.model=M[(M.indexOf(S.model)+1)%3]; rerender(); break;}
  case 'torch': S.torch=!S.torch; if(S.v==='nothing'&&S.torch){S.v='scanning';rerender();setTimeout(()=>{if(S.screen==='scan'){S.v='detected';rerender()}},900)} else rerender(); break;
  case 'digit': S.editIdx=+d.i; if(!S.digits)S.digits=U[S.util].digits.slice(); rerender(); break;
  case 'setdigit': S.digits[S.editIdx]=d.n; S.editIdx=null; rerender(); break;
  case 'saveScan': {const v=parseFloat((S.digits||U[S.util].digits).join('')); const util=S.util; later('saveScan',700,()=>{const r=addReading(util,v); S.stack=[]; S.screen='home'; S.v=null; savedSnack(util,r)}); break;}
  /* manual */
  case 'mutil': S.util=d.u; S.manual=''; rerender(); break;
  case 'toggleEl': el.classList.toggle('is-on'); break;
  case 'saveManual': {const v=parseFloat(S.manual), util=S.util; S.busy='saveManual'; updateManual(); setTimeout(()=>{S.busy=null;const r=addReading(util,v);S.stack=[];S.screen='home';savedSnack(util,r);render()},700); break;}
  /* top-up */
  case 'saveTop': {const u=parseFloat(S.topUnits); S.busy='saveTop'; $('#tSave').innerHTML=topSaveBtn(u); setTimeout(()=>{S.busy=null;S.elecLeft+=u;logActivity(`topped up <b>${fmt(u)} kWh</b>${S.topAmt?' for R'+S.topAmt:''}`,'Prepaid electricity','add_card');S.stack=[];S.screen='home';snack(`Top-up logged · +${fmt(u)} kWh. Run-out date updated for everyone.`,{icon:'check_circle',action:'UNDO',undo:()=>{S.elecLeft-=u;snack('Top-up removed')}});render()},800); break;}
  /* history */
  case 'hutil': S.util=d.u; rerender(); break;
  case 'delReading': S.delIdx=+d.i; S.overlay='delReading'; rerender(); break;
  case 'doDel': later('doDel',800,()=>{S.readings[S.util].splice(S.delIdx,1);S.overlay=null;snack('Reading deleted. Logged in activity.',{icon:'delete'})}); break;
  /* reports */
  case 'rutil': S.rUtil=d.u; S.bar=null; S.sug=null; rerender(); break;
  case 'month': S.month=d.m; S.bar=null; rerender(); break;
  case 'bar': S.bar=S.bar===+d.i?null:+d.i; rerender(); break;
  case 'sug': S.sug=true; rerender(); break;
  case 'fmt': S.exportFmt=d.f; rerender(); break;
  case 'period': S.period=+d.i; rerender(); break;
  case 'copyLink': S.overlay=null; snack('Link copied · expires in 7 days',{icon:'link'}); rerender(); break;
  case 'share': later('share',1000,()=>{S.overlay=null;snack(`${S.exportFmt} ready · opening share sheet`,{icon:'ios_share'})}); break;
  /* household */
  case 'approve': later('approve',800,()=>{S.req=false;S.members.push(['TM','Thabo M.','Member','av-info','Joined just now']);snack('Thabo joined as a member',{icon:'person_add',action:'UNDO',undo:()=>{S.members.pop();S.req=true;snack('Thabo removed')}})}); break;
  case 'decline': S.req=false; snack('Request declined',{action:'UNDO',undo:()=>{S.req=true}}); rerender(); break;
  case 'doNewCode': later('doNewCode',800,()=>{S.code='HK-'+Math.random().toString(36).slice(2,7).toUpperCase().replace(/[^A-Z0-9]/g,'Q');S.overlay=null;snack('New code ready. The old one no longer works.',{icon:'refresh'})}); break;
  case 'shareVia': S.overlay=null; snack(d.n==='Copy'?`Copied ${S.code}`:`Opening ${d.n}…`,{icon:d.n==='Copy'?'content_copy':'share'}); rerender(); break;
  case 'member': if(d.n.includes('(you)'))break; S.memberName=d.n; S.overlay='member'; rerender(); break;
  /* join */
  case 'joinGo': if(!/^HK-[A-Z0-9]{5}$/.test(S.join)){S.joinErr=true;$('#jBox').classList.add('is-error');$('#jHelp').innerHTML=`<span class="field-error">${icon('error')}Codes have 5 characters after HK-.</span>`;break}
    S.busy='join'; bindJoin(); setTimeout(()=>{S.busy=null; if(!S.online){S.joinErr=false;snack('Couldn\'t send join request. You\'re offline.',{icon:'error',action:'RETRY',undo:()=>handle('joinGo',el,e)});rerender();return} S.v='waiting';rerender()},900); break;
  case 'cancelJoin': S.v=null; snack('Request cancelled'); rerender(); break;
  case 'approvedSim': S.stack=[]; S.screen='home'; S.v=null; snack(`You joined Pretoria Home`,{icon:'celebration'}); render(); break;
  /* gas */
  case 'size': S.size=d.s; rerender(); break;
  case 'supplier': {S.supplier=d.n; S.supplierName=d.n; const f=SUPP.find(x=>x[0]===d.n); S.supPrice=priceFor(f?f[2]:1); S.overlay='supplier'; rerender(); break;}
  case 'sendOrder': later('sendOrder',900,()=>{S.order=S.supplier;S.overlay=null;S.stack=['home'];S.screen='gas';snack('Order sent on WhatsApp',{icon:'check_circle'})}); break;
  case 'delivered': {const a=activeCyl(); S.order=null; saveNewCylinder({size:parseInt(S.size),color:a?a.color:'#D32F2F',supplier:S.supplierName||'',price:S.supPrice}); snack(`New ${S.size} cylinder in use · full today`,{icon:'propane_tank'}); rerender(); break;}
  case 'cylPrev': if(S.cylPage>0){S.cylPage--;S.draft=null;S.cylPop=true;rerender()} break;
  case 'cylNext': S.cylPage++;S.draft=null;S.cylPop=true;rerender(); break;
  case 'cylPage': S.cylPage=+d.i;S.draft=null;S.cylPop=true;rerender(); break;
  case 'cylFocus': S.cylPage=+d.i;S.draft=null;S.cylPop=true;rerender();$('#scr .pbody').scrollTo({top:0,behavior:'smooth'}); break;
  case 'swapCyl': if(S.screen!=='gas'){go('gas')} S.cylPage=0;S.draft=null;S.cylPop=true;rerender();$('#scr .pbody')&&$('#scr .pbody').scrollTo({top:0,behavior:'smooth'}); break;
  case 'cylSize': S.draft.size=+d.k; S.cylPop=true; rerender(); break;
  case 'cylColor': S.draft.color=d.c; rerender(); break;
  case 'cycleColor': {const i=HK_CYL_COLORS.findIndex(c=>c[1]===S.draft.color); S.draft.color=HK_CYL_COLORS[(i+1)%HK_CYL_COLORS.length][1]; rerender(); break;}
  case 'cylStatus': S.draft.active=d.v==='1'; if(!S.draft.active&&!S.draft.end&&!S.draft.isNew)S.draft.end=TODAY; if(S.draft.active&&!S.draft.isNew)S.draft.end=null; rerender(); break;
  case 'svcToggle': S.svcOpen=!S.svcOpen; rerender(); break;
  case 'cylSave': {const dr={...S.draft}; const list=cylList(); const snap=JSON.stringify(list);
    later('cylSave',650,()=>{
      if(dr.isNew){saveNewCylinder(dr)} else {if(dr.active)list.forEach(c=>{if(c.active&&c.id!==dr.id){c.active=false;c.end=TODAY}}); const i=list.findIndex(c=>c.id===dr.id); list[i]={...dr}; S.draft=null; S.cylPage=sortedCyls().findIndex(c=>c.id===dr.id)+1}
      snack(dr.isNew?`Logged new ${dr.size} kg cylinder`:`Updated ${dr.size} kg cylinder`,{icon:'check_circle',action:'UNDO',undo:()=>{const r=JSON.parse(snap); list.length=0; r.forEach(x=>list.push(x)); S.draft=null; S.cylPage=Math.min(S.cylPage,list.length); snack('Change undone')}});
    }); break;}
  case 'cylDel': {const list=cylList(); const i=list.findIndex(c=>c.id===d.id); const [rm]=list.splice(i,1); S.draft=null; S.cylPage=Math.min(S.cylPage,list.length);
    snack(`Deleted ${rm.size} kg cylinder log`,{icon:'delete',action:'UNDO',undo:()=>{list.splice(i,0,rm);S.draft=null}}); rerender(); break;}
  /* settings */
  case 'notif': S.notif[d.k]=!S.notif[d.k]; rerender(); break;
  case 'ocr': {const i=+d.i; if(i===2&&S.ocr!==2){later('ocr2',1400,()=>{S.ocr=2;snack('Slashed-zero model ready',{icon:'download_done'})})} else {S.ocr=i;rerender()} break;}
  /* panels */
  case 'menu': {const m=MENU.flatMap(g=>g[2]).find(x=>x[0]===d.k); if(m) m[2](); break;}
  case 'variant': S.v=d.v; if(S.screen==='scan'){S.digits=null;S.editIdx=null;S._scanTok=0} rerender(); break;
  case 'data': S.data=d.v; rerender(); break;
  case 'net': S.online=d.v==='on'; if(S.online&&pending()){setTimeout(()=>{Object.values(S.readings).flat().forEach(r=>r.s='ok');rerender()},1500)} rerender(); break;
  }
}

/* ================= SIDE PANELS ================= */
const nav=(screen,opts={})=>()=>{S.stack=[];S.screen='home';if(opts.data)S.data=opts.data;else if(opts.data===undefined&&S.data!=='full'&&opts.reset!==false)S.data='full';if(opts.online!=null)S.online=opts.online;go(screen,opts);if(opts.overlay){S.overlay=opts.overlay;rerender()}};
const MENU=[
 ['Home','space_dashboard',[['home','Home dashboard',nav('home')]]],
 ['Log','document_scanner',[['scanE','Scan electricity',nav('scan',{util:'elec'})],['scanW','Scan water',nav('scan',{util:'water'})],['manual','Type a reading',nav('manual',{util:'elec'})],['topup','Log a top-up',nav('topup')],['history','Reading history',nav('history',{util:'elec'})]]],
 ['Usage','bolt',[['usageE','Electricity & run-out',nav('usage',{util:'elec'})],['usageW','Water usage',nav('usage',{util:'water'})]]],
 ['Reports','monitoring',[['reports','Monthly report',nav('reports')],['period','Custom period',nav('reports',{overlay:'periodSheet'})],['export','Export PDF / CSV',nav('reports',{overlay:'exportSheet'})]]],
 ['Share','group',[['household','Household & members',nav('household')],['share','Share join code',nav('household',{overlay:'shareSheet'})],['join','Join with a code',nav('join')],['activity','Activity feed',nav('activity')]]],
 ['Gas','propane_tank',[['gas','Cylinder tracker',nav('gas')],['order','Order gas',nav('order')]]],
 ['More','settings',[['notifications','Notifications',nav('notifications')],['notifsettings','Notification settings',nav('notifsettings')],['settings','Settings',nav('settings')]]],
 ['Empty states','inbox',[['eHome','New household · Home',nav('home',{data:'empty'})],['eReports','Reports · not enough data',nav('reports',{data:'empty'})],['eUsage','Usage · not enough data',nav('usage',{data:'empty',util:'elec'})],['eHouse','Household · only you',nav('household',{data:'empty'})],['eHist','History · no readings',nav('history',{data:'empty',util:'elec'})],['eNotif','Notifications · all clear',nav('notifications',{data:'empty'})],['eGas','Gas · no cylinder',nav('gas',{data:'empty'})],['eOrder','Order · no suppliers',nav('order',{v:'none'})],['eScan','Scanner · nothing found',nav('scan',{util:'elec',v:'nothing'})]]],
];
function curKey(){
  const sc=S.screen,dt=S.data;
  if(dt==='empty'){return {home:'eHome',reports:'eReports',usage:'eUsage',household:'eHouse',history:'eHist',notifications:'eNotif',gas:'eGas'}[sc]}
  if(sc==='scan')return S.v==='nothing'?'eScan':S.util==='water'?'scanW':'scanE';
  if(sc==='usage')return S.util==='water'?'usageW':'usageE';
  if(sc==='order'&&S.v==='none')return 'eOrder';
  if(sc==='reports'&&S.overlay==='periodSheet')return 'period';
  if(sc==='reports'&&S.overlay==='exportSheet')return 'export';
  if(sc==='household'&&S.overlay==='shareSheet')return 'share';
  return sc;
}
function renderMenu(){
  const k=curKey();
  $('#menu').innerHTML=`<div class="p-brand"><span class="logo">${icon('home_iot_device','fill')}</span><div><b>HouseKeeper prototype</b><a href="design-system.html">Design system →</a></div></div>
  ${MENU.map(([g,ic,items])=>`<div class="p-group"><h6>${icon(ic)}${g}</h6>${items.map(([key,label])=>`<button class="p-link ${k===key?'is-cur':''}" data-act="menu" data-k="${key}">${label}</button>`).join('')}</div>`).join('')}`;
}
const NOTES={
 home:['Home dashboard','4.3 · 4.4 · 5.9','Three one-tap tiles open the scanner (electricity, water) or the gas tracker. The run-out countdown is the headline. The gas row shows your actual cylinder, in its colour and size, with its level. Recent activity sits in its own card.',['Tap a tile to log a reading, then see it appear in Recent activity','Log a top-up and watch the countdown turn green','Tap the gas row to open the cylinder tracker','Switch Network to Offline, then save a reading']],
 scan:['Scanner','4.3 Quick logging','The live camera reads the meter. The top bar shows which OCR model is running (tap it to cycle) and which utility you\'re logging. Uncertain digits are outlined. Tap one to fix just that digit.',['Tap the amber "?" digit and pick a number','Type the reading opens manual entry, prefilled','Save shows a snackbar with UNDO','Switch to Water at the top']],
 manual:['Type a reading','4.3 Sense checks','Prefilled from the scanner when you come from there. Sense checks run as you type: lower than last time, or far above normal. You can always save anyway.',['Type 3700 to see the "lower than" warning','Type 3900 to see the "far above normal" warning','Type letters to see the error state','Clear the field: Save is disabled']],
 topup:['Log a top-up','4.3 Top-ups','Records bought units so a top-up doesn\'t look like negative usage. The preview shows the new balance and how long it lasts before you save.',['Enter 120 units and watch the preview','Save, then check the Home countdown']],
 usage:['Usage','4.4 Usage trends','Detail for one utility. Electricity shows the run-out countdown; water (postpaid) shows daily use instead. Bars are tappable.',['Tap any bar to inspect that day','Red bars are anomalies; hatched bars are projected']],
 history:['Reading history','4.3 Edit & delete','Every reading, newest first, with sync status. Deleting asks for confirmation because it can\'t be undone and affects every member.',['Delete a reading: dialog → loading → snackbar','Save a reading offline, then check its "Waiting" badge']],
 reports:['Monthly report','4.4 · 4.5 · 4.7','The same utility tiles as Home pick the utility, showing each one\'s month-end estimate. Below: next 7 days with confidence, month-end use and cost, the daily bar chart, and an AI suggestion.',['Tap Water or Gas tiles (confidence changes)','Tap bars to inspect days','Rate the suggestion','Open Custom period and Export']],
 household:['Household & members','4.2 Households','Join code with QR, regenerate with confirmation, approve or decline join requests, and tap a member to change their role.',['Approve Thabo (loading → added → UNDO)','Make a new code (dialog)','Share the code (sheet)']],
 join:['Join with a code','4.2 Join requests','Enter a code and send a request. The owner approves it, and you wait on this screen until they do.',['Type HK-4F7 and send: error state','Type HK-4F7Q2 and send: loading → waiting','Go offline first to see the retry snackbar']],
 activity:['Activity feed','4.2 Activity','Who logged what, who bought electricity, who swapped a cylinder. It answers "did anyone buy electricity?" without a phone call.',[]],
 gas:['Gas cylinder','4.8 · existing GasCylinderTrackerScreen','Your existing tracker, restyled. Swipe through cylinders (page 1 is a new, dashed cylinder). The drawing resizes with the size you pick and shows the projected gas level in the cylinder\'s own colour. Days left come from your past cylinders\' kg/day.',['Pick 4 / 9 / 14 / 48 kg: the cylinder resizes','Tap a colour swatch, or tap the cylinder to cycle','Open Service dates and change the start date','Swipe to a finished cylinder: see its kg/day','Swap cylinder → save a new one; the old one is finished']],
 order:['Order gas','4.8 Ordering','Suppliers near your address with prices for the chosen size. Sponsored suppliers are labelled. The order goes through the supplier\'s own channel: HouseKeeper never takes payment.',['Change the size chip','Tap a supplier → Send order on WhatsApp']],

 notifsettings:['Notification settings','4.6 Settings','Per-household switches that apply instantly, plus quiet hours.',['Toggle a switch']],
 settings:['Settings','4.9 Settings','Profile, app preferences, scanner model and privacy. Delete account explains what happens to a household you own.',['Choose Slashed-zero model: download progress','Delete account (dialog)']],
};
const VARIANTS={scan:[['scanning','Scanning'],['detected','Reading found'],['nothing','Nothing found']],join:[['enter','Enter code'],['waiting','Waiting for approval']],order:[['list','Suppliers'],['none','No suppliers']]};

  const n=NOTES[S.screen]||['','','',[]]; const vs=VARIANTS[S.screen];
  const dataOK=['home','reports','household','usage','history','notifications','gas'].includes(S.screen);
  $('#notes').innerHTML=`<span class="spec">Spec ${n[1]}</span><h3>${n[0]}</h3><p>${n[2]}</p>
  ${n[3].length?`<h5>Try this</h5><ul>${n[3].map(t=>`<li>${t}</li>`).join('')}</ul>`:''}
  ${vs?`<h5>Screen state</h5><div class="chips">${vs.map(([k,l])=>`<span class="chip ${(S.v||vs[S.screen==='scan'?1:0][0])===k?'is-selected':''}" data-act="variant" data-v="${k}">${l}</span>`).join('')}</div>`:''}
  <h5>Household data</h5><div class="chips">${[['full','Sample household'],['empty','New household'],['loading','Loading']].map(([k,l])=>`<span class="chip ${S.data===k?'is-selected':''} ${!dataOK?'is-disabled':''}" ${dataOK?`data-act="data" data-v="${k}"`:''}>${l}</span>`).join('')}</div>
  ${!dataOK?'<p style="font-size:12px">This screen looks the same with any data.</p>':''}
  <h5>Network</h5><div class="chips"><span class="chip ${S.online?'is-selected':''}" data-act="net" data-v="on">${icon('wifi','xs')}Online</span><span class="chip ${!S.online?'is-selected':''}" data-act="net" data-v="off">${icon('wifi_off','xs')}Offline</span></div>
  <p style="font-size:12px">Offline: readings save on the phone with a "waiting to sync" badge and upload when you switch back.</p>
  <h5>Crumb</h5><p style="font-size:12px;font-family:var(--mono)">${[...S.stack,S.screen].join(' → ')}</p>`;
  $('#crumb').textContent=(n[0]||S.screen)+(S.data!=='full'&&dataOK?` · ${S.data}`:'')+(S.online?'':' · offline');
}

render();
{const k=location.hash.slice(1);const m=MENU.flatMap(g=>g[2]).find(x=>x[0]===k);if(m)m[2]();}
